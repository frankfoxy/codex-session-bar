[package]
name = "codex-session-bar"
version = "0.2.0"
edition = "2021"
description = "Native Windows companion for Codex Desktop"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "=0.25.5", default-features = false, features = ["png"] }
rand = "0.8"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com",
  "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Ole",
  "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Foundation_Numerics",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="454" viewBox="0 0 1100 454" role="img" aria-labelledby="title desc">
  <title id="title">Codex Session Bar 自动居中停靠示意</title>
  <desc id="desc">悬浮条位于 Codex 标题栏的可用空白区中央，左侧菜单和右侧窗口按钮保持可用。下方放大展示会话名称、Busy 数量、耗时、Token、速率和剩余额度。所有数据均为演示。</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1">
      <stop stop-color="#111b24"/>
      <stop offset="1" stop-color="#132820"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-60%" width="130%" height="240%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <g id="bar" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e8edf1">
      <rect width="600" height="36" rx="9" fill="#232a2f" stroke="#55716b"/>
      <rect x="7" y="5" width="27" height="26" rx="6" fill="#34433f"/>
      <g transform="translate(14 10)" fill="none" stroke="#94e3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 1h6M5 1v5L0 14q-1 2 2 2h12q3 0 2-2l-5-8V1"/>
        <path d="M3 10h10"/>
      </g>
      <text x="43" y="23">xxx 会话名称</text>
      <circle cx="146" cy="18" r="2.5" fill="#ffaf45"/>
      <text x="153" y="23" fill="#ffaf45">Busy (3)</text>
      <text x="211" y="23" fill="#bac7d1">12:08</text>
      <g fill="#82939e">
        <circle cx="259" cy="13" r="1"/><circle cx="264" cy="13" r="1"/>
        <circle cx="259" cy="18" r="1"/><circle cx="264" cy="18" r="1"/>
        <circle cx="259" cy="23" r="1"/><circle cx="264" cy="23" r="1"/>
      </g>
      <text x="278" y="23" fill="#bac7d1">28.4M</text>
      <text x="336" y="23" fill="#bac7d1">42.3 t/s</text>
      <text x="406" y="23" fill="#bac7d1">7d</text>
      <rect x="427" y="12" width="26" height="12" rx="3" fill="none" stroke="#4cd98b"/>
      <rect x="430" y="15" width="19" height="6" rx="1" fill="#4cd98b"/>
      <path d="M455 16v4" stroke="#4cd98b" stroke-width="2"/>
      <circle cx="469" cy="18" r="5" fill="none" stroke="#405160" stroke-width="2"/>
      <path d="M469 13a5 5 0 0 1 4.3 7.5" fill="none" stroke="#70aaff" stroke-width="2"/>
      <text x="481" y="23">78%</text>
      <g fill="none" stroke="#bac7d1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="m541 16 4 4 4-4"/>
        <path d="m575 14 8 8m0-8-8 8"/>
      </g>
    </g>
  </defs>
  <rect x=".5" y=".5" width="1099" height="453" rx="18" fill="url(#back)" stroke="#29423e"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="34" y="46" fill="#eef7f3" font-size="26" font-weight="600">默认居中停靠，信息一眼可见</text>
    <text x="35" y="75" fill="#a6bdb7" font-size="15">自动进入标题栏空白区，保留菜单和窗口按钮的操作空间。</text>
    <rect x="930" y="28" width="135" height="28" rx="14" fill="#203d32" stroke="#395e4f"/>
    <circle cx="948" cy="42" r="3" fill="#85deb0"/>
    <text x="961" y="47" fill="#b1eacb" font-size="12" letter-spacing="1">AUTO DOCK</text>

    <rect x="28" y="103" width="1044" height="142" rx="10" fill="#171a1d" stroke="#3b474c"/>
    <path d="M38 103h1024q10 0 10 10v42H28v-42q0-10 10-10" fill="#202326"/>
    <path d="M28 155h1044" stroke="#353d42"/>
    <g font-size="14" fill="#c0c7cd">
      <text x="44" y="134">‹</text><text x="69" y="134">›</text>
      <rect x="93" y="123" width="12" height="10" rx="1" fill="none" stroke="#8b969e"/>
      <path d="M97 123v10" stroke="#8b969e"/>
      <text x="124" y="134">File</text><text x="163" y="134">Edit</text>
      <text x="204" y="134">View</text><text x="250" y="134">Help</text>
    </g>
    <rect x="302" y="107" width="640" height="44" rx="11" fill="#7cd9ad" fill-opacity=".07" stroke="#79caa6" stroke-dasharray="4 5" stroke-opacity=".55"/>
    <use xlink:href="#bar" x="322" y="111" filter="url(#shadow)"/>
    <g stroke="#9aa7b0" fill="none" stroke-width="1.2">
      <path d="M968 129h9"/><rect x="1006" y="124" width="9" height="9"/>
      <path d="m1045 124 9 9m0-9-9 9"/>
    </g>
    <path d="M185 156v89" stroke="#30373d"/>
    <g fill="#677880" font-size="12">
      <text x="46" y="183">Codex</text>
      <rect x="46" y="197" width="109" height="6" rx="3" fill="#303d40"/>
      <rect x="46" y="215" width="85" height="6" rx="3" fill="#2b363a"/>
    </g>
    <text x="211" y="184" fill="#9eafb7" font-size="13">xxx 会话名称</text>
    <rect x="211" y="201" width="467" height="6" rx="3" fill="#283438"/>
    <rect x="211" y="219" width="334" height="6" rx="3" fill="#243034"/>
    <path d="M622 151v109" stroke="#75b698" stroke-opacity=".65" stroke-dasharray="4 5"/>
    <text x="35" y="285" fill="#b9d3c8" font-size="13">悬浮条放大展示</text>
    <text x="1065" y="285" text-anchor="end" fill="#7e9e91" font-size="12">示例名称与演示数据</text>
    <use xlink:href="#bar" transform="translate(70 302) scale(1.6)" filter="url(#shadow)"/>

    <g font-size="15" fill="#b5c9c2">
      <circle cx="81" cy="408" r="11" fill="#203c31"/>
      <path d="m76 408 3 3 6-7" fill="none" stroke="#85deb0" stroke-width="1.6"/>
      <text x="102" y="414">菜单保持可用</text>
      <circle cx="407" cy="408" r="11" fill="#203c31"/>
      <path d="m402 408 3 3 6-7" fill="none" stroke="#85deb0" stroke-width="1.6"/>
      <text x="428" y="414">空白区域自动居中</text>
      <circle cx="777" cy="408" r="11" fill="#203c31"/>
      <path d="m772 408 3 3 6-7" fill="none" stroke="#85deb0" stroke-width="1.6"/>
      <text x="798" y="414">随窗口移动与隐藏</text>
    </g>
  </g>
</svg>
